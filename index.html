<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>のこりいくら？ | お金メモ</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#eaf0fb;background:#0c1220;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 16px calc(38px + env(safe-area-inset-bottom));min-height:100dvh}main{max-width:520px;margin:auto}header{padding:26px 4px 18px}h1{font-size:23px;margin:0 0 4px;letter-spacing:.02em}header p{margin:0;color:#98a9c5;font-size:13px}.balance{padding:24px;border-radius:24px;background:linear-gradient(140deg,#1c3558,#18263b 68%,#1a2540);border:1px solid #355072;box-shadow:0 12px 36px #0005}.balance .tag{font-size:13px;color:#b8cae5}.amount{font-size:clamp(34px,10vw,47px);font-weight:800;letter-spacing:-1.5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;margin:9px 0 10px}.amount.negative{color:#ffaaa8}.sub{font-size:12px;color:#b7c6dd;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}section{margin-top:22px}h2{font-size:17px;margin:0 0 12px}.panel{padding:17px;border-radius:20px;background:#172234;border:1px solid #29384f}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.tab{background:#25344b;border:1px solid #334762;color:#d3dff1;padding:11px;font-size:15px;font-weight:700;border-radius:12px;cursor:pointer}.tab.active{background:#d9eaff;color:#102037;border-color:#d9eaff}label{display:block;color:#acbdd6;font-size:12px;font-weight:650;margin:0 0 7px}.field{margin-bottom:14px}input{width:100%;background:#0e1827;color:white;border:1px solid #3c4c64;border-radius:12px;padding:13px 14px;font-size:16px;outline:none}input:focus{border-color:#8fb7ff;box-shadow:0 0 0 2px #8fb7ff22}input::placeholder{color:#687c9a}.primary{width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:800;background:#a8ccff;color:#0c213d;cursor:pointer}.primary:active,.tab:active{transform:scale(.99)}.heading-row{display:flex;justify-content:space-between;align-items:center}.muted{font-size:12px;color:#9bb0ce}.entries{list-style:none;margin:0;padding:0;display:grid;gap:9px}.entry{padding:13px 14px;border:1px solid #29384f;background:#172234;border-radius:15px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}.entry-title{font-size:14px;font-weight:700;overflow-wrap:anywhere}.entry-date{font-size:11px;color:#9ab0cc;margin-top:4px}.entry-value{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.entry-value.expense{color:#ffb9ae}.entry-value.income{color:#9ee4bb}.delete{background:#2b3649;color:#bbcbe2;border:0;width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:17px}.empty{padding:28px 10px;text-align:center;color:#9cb0cf;font-size:14px;border:1px dashed #35455e;border-radius:16px}.tools{display:flex;gap:9px;margin-top:13px;flex-wrap:wrap}.secondary{background:#25354a;border:1px solid #425673;color:#dce8f6;padding:10px 13px;border-radius:11px;font-size:12px;cursor:pointer}.note{font-size:12px;line-height:1.7;color:#8e9fb9;margin:14px 4px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#d9eaff;color:#162841;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:0 6px 24px #0008;display:none;white-space:nowrap}.toast.show{display:block}.small-input{max-width:190px}.inline{display:flex;gap:9px}.inline input{flex:1;min-width:0}.inline button{flex:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}button:focus-visible{outline:2px solid #b7d5ff;outline-offset:2px}
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.wallet{border:1px solid #344e6e;background:#192c46;border-radius:18px;padding:16px 13px}.wallet .tag{font-size:12px;color:#bdcde4}.wallet .cash-amount{font-size:clamp(23px,6vw,31px);font-weight:800;margin:8px 0 2px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.wallet .cash-amount.negative{color:#ffaaa8}.wallet .small{font-size:11px;color:#96aecf}.walletpick{display:grid;grid-template-columns:1fr 1fr;gap:9px}.walletpick label{margin:0}.walletpick input{position:absolute;opacity:0;width:1px}.walletpick span{display:block;text-align:center;background:#25344b;border:1px solid #3c506e;color:#d3dff1;padding:13px 7px;border-radius:12px;font-size:14px;cursor:pointer}.walletpick input:checked+span{background:#d9eaff;border-color:#d9eaff;color:#102037;font-weight:800}.walletpick input:focus-visible+span{outline:2px solid #8fb7ff;outline-offset:2px}.entry-wallet{display:inline-block;color:#b5ccee;font-size:11px;margin-top:5px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.settings-grid input{min-width:0}.transfer-box{margin-top:12px}

.daily-list{display:grid;gap:10px}.daily-card{border-radius:16px;padding:15px;background:#172234;border:1px solid #29384f}.daily-head{font-size:15px;font-weight:750;margin-bottom:10px}.daily-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px;color:#b9cce5}.daily-row strong{font-variant-numeric:tabular-nums;color:#eaf0fb}.daily-row.total{font-size:16px;border-bottom:1px solid #39475d;padding-bottom:10px;margin-bottom:5px}.daily-row.total strong{font-size:20px}.hint{color:#9bb0ce;font-size:12px;margin-top:10px}
</style></head><body><main>
<header><h1>のこりいくら？ 💰</h1><p>現金・電子マネーを分けて管理しよう。</p></header>
<div class="balance" aria-live="polite"><div class="tag">合計の残額</div><div id="total" class="amount">¥40,000</div><div class="sub"><span>現金 + 電子マネー</span><span id="countText">記録 0 件</span></div></div>
<div class="wallets" aria-live="polite"><div class="wallet"><div class="tag">💴 現金</div><div class="cash-amount" id="cashBalance">¥20,000</div><div class="small" id="cashCount">記録 0 件</div></div><div class="wallet"><div class="tag">📱 電子マネー</div><div class="cash-amount" id="digitalBalance">¥20,000</div><div class="small" id="digitalCount">記録 0 件</div></div></div>
<section><h2>お金を記録</h2><div class="panel"><div class="field"><label>どのお金？</label><div class="walletpick"><label><input type="radio" name="wallet" value="cash" checked><span>💴 現金</span></label><label><input type="radio" name="wallet" value="digital"><span>📱 電子マネー</span></label></div></div><div class="tabs" role="group" aria-label="記録の種類"><button type="button" id="expenseTab" class="tab active" aria-pressed="true">− 使った</button><button type="button" id="incomeTab" class="tab" aria-pressed="false">＋ 増えた</button></div><form id="entryForm"><div class="field"><label for="amountInput">金額（円）</label><input id="amountInput" type="number" min="1" max="999999999999" step="1" inputmode="numeric" placeholder="例：850" required></div><div class="field"><label for="entryDate">記録する日付</label><input id="entryDate" type="date" required></div><div class="field"><label for="memoInput">メモ（省略OK）</label><input id="memoInput" maxlength="80" placeholder="例：お昼ごはん"></div><button class="primary" id="addButton">支出を記録する</button></form></div></section>
<section><h2>お金を移動する</h2><div class="panel"><form id="transferForm"><div class="field"><label for="transferDirection">移動の方向</label><select id="transferDirection" style="width:100%;background:#0e1827;color:white;border:1px solid #3c4c64;border-radius:12px;padding:13px;font-size:16px"><option value="cash">現金 → 電子マネー</option><option value="digital">電子マネー → 現金</option></select></div><div class="field"><label for="transferAmount">移動する金額（円）</label><input id="transferAmount" type="number" min="1" max="999999999999" step="1" inputmode="numeric" placeholder="例：1000" required></div><button class="primary" type="submit">移動を記録する</button></form></div></section>
<section><h2>日ごとの合計</h2><div id="dailySummary" class="daily-list"></div><p class="hint">残高移動は支出・収入の集計に含まれません。</p></section><section><div class="heading-row"><h2>記録履歴</h2><span class="muted" id="historyCount">0 件</span></div><ul class="entries" id="history"></ul></section>
<section><h2>設定・バックアップ</h2><div class="panel"><div class="settings-grid"><div><label for="initialCash">現金の開始金額</label><input id="initialCash" type="number" min="0" max="999999999999" step="1" inputmode="numeric" value="20000"></div><div><label for="initialDigital">電子マネーの開始金額</label><input id="initialDigital" type="number" min="0" max="999999999999" step="1" inputmode="numeric" value="20000"></div></div><div class="tools"><button class="secondary" id="saveInitial" type="button">開始金額を設定する</button></div><div class="tools"><button class="secondary" id="exportBtn" type="button">記録を保存（JSON）</button><button class="secondary" id="importBtn" type="button">記録を読み込む</button><button class="secondary" id="resetBtn" type="button">すべてリセット</button></div><input id="importFile" type="file" accept=".json,application/json" class="sr-only"></div><p class="note">このブラウザ内に自動保存されます。別のブラウザ・端末とは同期されません。閲覧データの削除などに備えて、定期的にバックアップを保存してください。</p></section></main><div id="toast" class="toast" role="status"></div>
<script>
(()=>{'use strict';
const KEY='nokoriikura-v2', OLD='nokoriikura-v1';const defaults=()=>({initial:{cash:20000,digital:20000},items:[]});let state=defaults(),type='expense';const $=id=>document.getElementById(id);const yen=n=>(n<0?'−':'')+'¥'+Math.abs(n).toLocaleString('ja-JP');const valid=n=>Number.isSafeInteger(n)&&n>=0&&n<=999999999999;
function notify(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),2300)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('保存できません。ブラウザ設定を確認してね')}}
function sanitize(obj){if(!obj||!obj.initial||!valid(obj.initial.cash)||!valid(obj.initial.digital)||!Array.isArray(obj.items)||obj.items.length>100000)throw Error('不正なデータ');return {initial:{cash:obj.initial.cash,digital:obj.initial.digital},items:obj.items.map(x=>{if(!x||!['cash','digital'].includes(x.wallet)||!['income','expense','transfer'].includes(x.type)||!valid(x.amount)||x.amount<1||typeof x.memo!=='string'||x.memo.length>80||typeof x.date!=='string'||!Number.isFinite(Date.parse(x.date))||typeof x.id!=='string')throw Error('不正な履歴');return {wallet:x.wallet,type:x.type,amount:x.amount,memo:x.memo,date:x.date,id:x.id}})}}
try{const raw=localStorage.getItem(KEY);if(raw)state=sanitize(JSON.parse(raw));else{const prior=localStorage.getItem(OLD);if(prior){const old=JSON.parse(prior);if(valid(old.initial)&&Array.isArray(old.items)){state=sanitize({initial:{cash:old.initial,digital:20000},items:old.items.map(x=>({...x,wallet:'cash'}))});persist()}}}}catch(e){notify('以前の記録を読み込めませんでした')}
function balances(){let cash=state.initial.cash,digital=state.initial.digital;for(const x of state.items){if(x.type==='transfer'){if(x.wallet==='cash'){cash-=x.amount;digital+=x.amount}else{digital-=x.amount;cash+=x.amount}}else if(x.wallet==='cash')cash+=x.type==='income'?x.amount:-x.amount;else digital+=x.type==='income'?x.amount:-x.amount}return{cash,digital}}
function localDay(value){const d=new Date(value);if(Number.isNaN(d.getTime()))return '';return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function renderDaily(){const summary=new Map();for(const x of state.items){if(x.type==='transfer')continue;const day=localDay(x.date);if(!day)continue;if(!summary.has(day))summary.set(day,{expense:0,income:0,cash:0,digital:0});const v=summary.get(day);v[x.type]+=x.amount;if(x.type==='expense')v[x.wallet]+=x.amount}const root=$('dailySummary');root.replaceChildren();if(!summary.size){const el=document.createElement('div');el.className='empty';el.textContent='記録すると日ごとの合計が表示されるよ。';root.append(el);return}for(const [day,v] of [...summary].sort((a,b)=>b[0].localeCompare(a[0]))){const card=document.createElement('div');card.className='daily-card';const heading=document.createElement('div');heading.className='daily-head';heading.textContent=day;card.append(heading);for(const [label,value,cls] of [['支出合計',v.expense,'total'],['現金の支出',v.cash,''],['電子マネーの支出',v.digital,''],['収入合計',v.income,'']]){const row=document.createElement('div');row.className='daily-row '+cls;const name=document.createElement('span');name.textContent=label;const val=document.createElement('strong');val.textContent=(label==='収入合計'?'+':'')+yen(value);row.append(name,val);card.append(row)}root.append(card)}}
function render(){renderDaily();const b=balances();for(const [id,n] of [['cashBalance',b.cash],['digitalBalance',b.digital],['total',b.cash+b.digital]]){$(id).textContent=yen(n);$(id).classList.toggle('negative',n<0)}$('countText').textContent='記録 '+state.items.length+' 件';$('historyCount').textContent=state.items.length+' 件';$('cashCount').textContent='開始 '+yen(state.initial.cash);$('digitalCount').textContent='開始 '+yen(state.initial.digital);$('initialCash').value=state.initial.cash;$('initialDigital').value=state.initial.digital;const ul=$('history');ul.replaceChildren();if(!state.items.length){const li=document.createElement('li');li.className='empty';li.textContent='まだ記録がないよ。';ul.append(li)}else for(const x of [...state.items].reverse()){const li=document.createElement('li');li.className='entry';const left=document.createElement('div');const name=document.createElement('div');name.className='entry-title';name.textContent=x.memo||(x.type==='transfer'?'残高の移動':x.type==='expense'?'支出':'収入');const date=document.createElement('div');date.className='entry-date';date.textContent=localDay(x.date);const wallet=document.createElement('div');wallet.className='entry-wallet';wallet.textContent=x.type==='transfer'?(x.wallet==='cash'?'💴 現金 → 📱 電子マネー':'📱 電子マネー → 💴 現金'):(x.wallet==='cash'?'💴 現金':'📱 電子マネー');left.append(name,date,wallet);const value=document.createElement('div');value.className='entry-value '+x.type;value.textContent=(x.type==='transfer'?'↔':x.type==='income'?'+':'−')+yen(x.amount);const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='×';del.setAttribute('aria-label','記録を削除');del.addEventListener('click',()=>{if(confirm('この記録を削除する？')){state.items=state.items.filter(v=>v.id!==x.id);persist();render()}});li.append(left,value,del);ul.append(li)}}
function setType(t){type=t;for(const v of ['expense','income']){$(v+'Tab').classList.toggle('active',t===v);$(v+'Tab').setAttribute('aria-pressed',String(t===v))}$('addButton').textContent=t==='expense'?'支出を記録する':'収入を記録する'}$('expenseTab').addEventListener('click',()=>setType('expense'));$('incomeTab').addEventListener('click',()=>setType('income'));
function add(item){state.items.push({id:(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random()),date:new Date().toISOString(),...item});persist();render();notify('記録したよ！')}
$('entryForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('amountInput').value);if(!valid(amount)||amount<1)return notify('1円以上の整数を入力してね');const selected=$('entryDate').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(selected)||localDay(selected+'T12:00:00')!==selected)return notify('有効な日付を選んでね');add({wallet:document.querySelector('input[name="wallet"]:checked').value,type,amount,memo:$('memoInput').value.trim(),date:selected+'T12:00:00'});$('amountInput').value='';$('memoInput').value=''});
$('transferForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('transferAmount').value);if(!valid(amount)||amount<1)return notify('1円以上の整数を入力してね');const wallet=$('transferDirection').value;if(balances()[wallet]<amount&&!confirm('移動元の残額を超えるよ。続ける？'))return;add({wallet,type:'transfer',amount,memo:'残高の移動'});$('transferAmount').value=''});
$('saveInitial').addEventListener('click',()=>{const cash=Number($('initialCash').value),digital=Number($('initialDigital').value);if(!valid(cash)||!valid(digital))return notify('0円以上の整数を入力してね');state.initial={cash,digital};persist();render();notify('開始金額を変更したよ')});
$('resetBtn').addEventListener('click',()=>{if(confirm('開始金額と履歴をすべて削除する？')){state=defaults();persist();render();notify('リセットしたよ')}});
$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='お金メモ-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('バックアップを作成したよ')});
$('entryDate').value=localDay(new Date());$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());let next;if(typeof obj.initial==='number'&&valid(obj.initial))next=sanitize({initial:{cash:obj.initial,digital:20000},items:obj.items.map(x=>({...x,wallet:'cash'}))});else next=sanitize(obj);if(confirm('現在の記録を置き換える？')){state=next;persist();render();notify('読み込んだよ')}}catch(err){notify('読み込みに失敗したよ')}e.target.value=''});render();
})();
</script></body></html>
